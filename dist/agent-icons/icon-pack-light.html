<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TwinX MOS Agent Icon Pack — Light</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #343a40; padding: 40px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 28px; color: #212529; }
  p.sub { text-align: center; margin-bottom: 40px; color: #868e96; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #dee2e6; border-radius: 16px; padding: 28px 20px 20px; text-align: center; transition: transform .15s, border-color .15s, box-shadow .15s; cursor: pointer; }
  .card:hover { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .icon-wrap { width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .icon-wrap svg { width: 44px; height: 44px; }
  .card .name { font-size: 15px; font-weight: 700; color: #212529; margin-bottom: 4px; }
  .card .role { font-size: 11px; color: #868e96; margin-bottom: 10px; line-height: 1.4; }
  .card .dl { font-size: 11px; font-weight: 600; opacity: .7; }
  .actions { text-align: center; margin: 0 0 40px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .actions button { background: #fff; color: #343a40; border: 1px solid #dee2e6; padding: 10px 24px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; transition: background .15s, border-color .15s; }
  .actions button:hover { background: #f1f3f5; border-color: #adb5bd; }
  .actions button.email-btn { background: #4263eb; color: #fff; border-color: #4263eb; }
  .actions button.email-btn:hover { background: #3b5bdb; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border: 1px solid #dee2e6; border-radius: 16px; padding: 32px; width: 440px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
  .modal h2 { font-size: 18px; color: #212529; margin-bottom: 6px; }
  .modal p.desc { font-size: 13px; color: #868e96; margin-bottom: 20px; }
  .modal label { display: block; font-size: 12px; color: #495057; margin-bottom: 6px; font-weight: 600; }
  .modal input[type="email"] { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #dee2e6; background: #f8f9fa; color: #212529; font-size: 14px; outline: none; }
  .modal input[type="email"]:focus { border-color: #4263eb; }
  .modal .agent-select { margin: 16px 0; max-height: 200px; overflow-y: auto; }
  .modal .agent-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background .1s; }
  .modal .agent-option:hover { background: #f1f3f5; }
  .modal .agent-option input[type="checkbox"] { accent-color: #4263eb; width: 16px; height: 16px; }
  .modal .agent-option .opt-icon { width: 24px; height: 24px; }
  .modal .agent-option span { font-size: 13px; color: #495057; }
  .modal .select-all { font-size: 12px; color: #4263eb; cursor: pointer; margin-bottom: 8px; display: inline-block; }
  .modal .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .modal .btn-row button { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .modal .btn-cancel { background: #f1f3f5; color: #495057; }
  .modal .btn-cancel:hover { background: #e9ecef; }
  .modal .btn-send { background: #4263eb; color: #fff; }
  .modal .btn-send:hover { background: #3b5bdb; }
  .card .card-actions { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .card .card-actions .mini-btn { font-size: 10px; padding: 4px 10px; border-radius: 6px; border: 1px solid #dee2e6; background: transparent; color: #868e96; cursor: pointer; transition: all .15s; }
  .card .card-actions .mini-btn:hover { border-color: var(--c); color: var(--c); }
</style>
</head>
<body>
<h1>TwinX MOS &mdash; Agent Icon Pack (Light)</h1>
<p class="sub">8 specialist agent icons &bull; Click any card to download SVG &bull; Use buttons below for bulk download</p>
<div class="actions">
  <button onclick="downloadAll('svg')">Download All SVGs</button>
  <button onclick="downloadAll('png')">Download All PNGs (256px)</button>
  <button class="email-btn" onclick="openEmailModal()">&#9993; Send via Email</button>
</div>
<div class="grid" id="grid"></div>

<!-- Email Modal -->
<div class="modal-overlay" id="emailModal">
  <div class="modal">
    <h2>&#9993; Send Icon Pack via Email</h2>
    <p class="desc">Select agents and enter a recipient email. Icons will be embedded inline in the email.</p>
    <label>Recipient Email</label>
    <input type="email" id="emailTo" placeholder="name@company.com" />
    <div class="agent-select">
      <span class="select-all" onclick="toggleAll()">Select All / None</span>
      <div id="agentChecklist"></div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeEmailModal()">Cancel</button>
      <button class="btn-send" onclick="sendEmail()">Open Mail Client</button>
    </div>
  </div>
</div>

<script>
const agents = [
  {
    id: "market-sentinel", name: "Market Sentinel", color: "#099268",
    role: "Signal Detection",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21"/><line x1="3" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21" y2="12"/></svg>`
  },
  {
    id: "context-decoder", name: "Context Decoder", color: "#0c8599",
    role: "Advisor Twin Mapping",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a3 3 0 0 0-3 3v2a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3z"/><path d="M15.5 11c.83.51 1.5 1.6 1.5 3v1c0 1.1-.9 2-2 2h-6a2 2 0 0 1-2-2v-1c0-1.4.67-2.49 1.5-3"/><path d="M9 21v-3"/><path d="M15 21v-3"/><circle cx="9" cy="8" r=".5" fill="currentColor"/><circle cx="15" cy="8" r=".5" fill="currentColor"/><path d="M4 13h2"/><path d="M18 13h2"/><path d="M5 17l1.5-1"/><path d="M17.5 16l1.5 1"/></svg>`
  },
  {
    id: "orchestration-agent", name: "Orchestration Agent", color: "#1971c2",
    role: "Workflow Coordination",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/><path d="M5.6 5.6l2.15 2.15"/><path d="M16.25 16.25l2.15 2.15"/><path d="M18.4 5.6l-2.15 2.15"/><path d="M7.75 16.25l-2.15 2.15"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 2"/></svg>`
  },
  {
    id: "quant-bridge", name: "Quant Bridge", color: "#6741d9",
    role: "Monte Carlo Simulation",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M4 15l4-6 3 4 3-8 6 10"/><circle cx="8" cy="9" r="1" fill="currentColor"/><circle cx="11" cy="13" r="1" fill="currentColor"/><circle cx="14" cy="5" r="1" fill="currentColor"/><circle cx="20" cy="15" r="1" fill="currentColor"/></svg>`
  },
  {
    id: "content-architect", name: "Content Architect", color: "#e8590c",
    role: "Content Personalisation",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6H4z"/><path d="M17 14v3h3"/><path d="M14 17h3v3"/><line x1="6" y1="6" x2="8" y2="8"/><line x1="16" y1="6" x2="18" y2="8"/><line x1="6" y1="16" x2="8" y2="18"/></svg>`
  },
  {
    id: "guardrail-guardian", name: "Guardrail Guardian", color: "#c92a2a",
    role: "Compliance Enforcement",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5.25-3.5 9.74-8 11-4.5-1.26-8-5.75-8-11V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>`
  },
  {
    id: "journey-executor", name: "Journey Executor", color: "#2b8a3e",
    role: "Multi-Touch Orchestration",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 17V8a2 2 0 0 1 2-2h3"/><path d="M18 7v8a2 2 0 0 1-2 2h-3"/><polyline points="13 6 11 4 13 2"/><polyline points="11 18 13 20 11 22"/></svg>`
  },
  {
    id: "ai-observability", name: "AI Observability", color: "#495057",
    role: "Drift & Performance Monitoring",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>`
  }
];

const grid = document.getElementById("grid");

agents.forEach(a => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--c", a.color);

  const bgColor = a.color + "12";
  card.innerHTML = `
    <div class="icon-wrap" style="background:${bgColor}; color:${a.color}">
      ${a.svg}
    </div>
    <div class="name">${a.name}</div>
    <div class="role">${a.role}</div>
    <div class="card-actions">
      <button class="mini-btn" onclick="event.stopPropagation(); downloadOne(agents.find(x=>x.id==='${a.id}'), 'svg')">SVG</button>
      <button class="mini-btn" onclick="event.stopPropagation(); downloadOne(agents.find(x=>x.id==='${a.id}'), 'png')">PNG</button>
      <button class="mini-btn" onclick="event.stopPropagation(); emailSingle('${a.id}')" style="border-color:#4263eb; color:#4263eb">&#9993; Email</button>
    </div>
  `;
  grid.appendChild(card);
});

function getColoredSvg(a) {
  return a.svg.replace(/currentColor/g, a.color);
}

function downloadOne(a, format) {
  const colored = getColoredSvg(a);
  if (format === 'svg') {
    const blob = new Blob([colored], { type: "image/svg+xml" });
    triggerDownload(blob, `${a.id}-light.svg`);
  } else {
    svgToPng(colored, 256, blob => triggerDownload(blob, `${a.id}-light.png`));
  }
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  URL.revokeObjectURL(url);
}

function svgToPng(svgStr, size, cb) {
  const img = new Image();
  const blob = new Blob([svgStr], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    canvas.toBlob(b => { cb(b); URL.revokeObjectURL(url); }, "image/png");
  };
  img.src = url;
}

function downloadAll(format) {
  let i = 0;
  function next() {
    if (i >= agents.length) return;
    downloadOne(agents[i], format);
    i++;
    setTimeout(next, 300);
  }
  next();
}

// ── Email functions ──

function openEmailModal(preselect) {
  const modal = document.getElementById("emailModal");
  const checklist = document.getElementById("agentChecklist");
  checklist.innerHTML = "";
  agents.forEach(a => {
    const checked = preselect ? preselect.includes(a.id) : true;
    const div = document.createElement("div");
    div.className = "agent-option";
    div.innerHTML = `
      <input type="checkbox" value="${a.id}" ${checked ? "checked" : ""} />
      <div class="opt-icon" style="color:${a.color}">${a.svg}</div>
      <span>${a.name}</span>
    `;
    div.onclick = (e) => { if (e.target.tagName !== 'INPUT') div.querySelector('input').click(); };
    checklist.appendChild(div);
  });
  modal.classList.add("open");
  setTimeout(() => document.getElementById("emailTo").focus(), 100);
}

function closeEmailModal() {
  document.getElementById("emailModal").classList.remove("open");
}

function toggleAll() {
  const boxes = document.querySelectorAll("#agentChecklist input[type=checkbox]");
  const allChecked = [...boxes].every(b => b.checked);
  boxes.forEach(b => b.checked = !allChecked);
}

function emailSingle(agentId) {
  openEmailModal([agentId]);
}

function sendEmail() {
  const to = document.getElementById("emailTo").value.trim();
  if (!to) { document.getElementById("emailTo").style.borderColor = "#ff6b6b"; return; }

  const selected = [...document.querySelectorAll("#agentChecklist input:checked")].map(c => c.value);
  if (!selected.length) return;

  const selectedAgents = agents.filter(a => selected.includes(a.id));
  const subject = `TwinX MOS Agent Icons — Light (${selectedAgents.length} icon${selectedAgents.length > 1 ? 's' : ''})`;

  let body = `TwinX MOS — Agent Icon Pack (Light Mode)\n`;
  body += `${'─'.repeat(40)}\n\n`;
  body += `${selectedAgents.length} agent icon(s) included below as inline SVG code.\n`;
  body += `Copy each SVG block and save as a .svg file, or paste directly into design tools.\n\n`;

  selectedAgents.forEach(a => {
    const colored = getColoredSvg(a);
    body += `── ${a.name} (${a.role}) ──\n`;
    body += `Color: ${a.color}\n`;
    body += `${colored}\n\n`;
  });

  body += `${'─'.repeat(40)}\n`;
  body += `Generated from TwinX MOS Agent Icon Pack (Light Mode)\n`;

  const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
  closeEmailModal();
}

// Close modal on overlay click
document.getElementById("emailModal").onclick = (e) => {
  if (e.target.id === "emailModal") closeEmailModal();
};

// Close modal on Escape
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeEmailModal();
});
</script>
</body>
</html>
